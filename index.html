<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final 450 — DSA Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --border2: #2e2e2e;
    --accent: #00ff88;
    --accent-dim: rgba(0,255,136,0.12);
    --accent-dim2: rgba(0,255,136,0.06);
    --amber: #ffb800;
    --amber-dim: rgba(255,184,0,0.12);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #444;
    --red: #ff4444;
    --blue: #4488ff;
    --blue-dim: rgba(68,136,255,0.12);
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
    line-height: 1.5;
  }

  a { color: inherit; text-decoration: none; }

  /* ── HEADER ── */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 56px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex: 1;
  }

  .h-stat {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    white-space: nowrap;
  }

  .h-stat span {
    color: var(--text);
    font-weight: 500;
  }

  .h-progress {
    flex: 1;
    max-width: 200px;
    height: 3px;
    background: var(--border2);
    border-radius: 99px;
    overflow: hidden;
  }

  .h-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  .h-pct {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  /* ── MAIN ── */
  .main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── HERO ── */
  .hero {
    margin-bottom: 2.5rem;
    padding: 2rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .hero-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .hero-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 0.75rem;
  }

  .hero-title .dim { color: var(--text3); }

  .hero-sub {
    font-size: 14px;
    color: var(--text2);
    font-family: var(--mono);
  }

  /* ── STATS CARDS ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .stat-card.total::before { background: var(--text3); }
  .stat-card.solved::before { background: var(--accent); }
  .stat-card.remaining::before { background: var(--blue); }
  .stat-card.revision::before { background: var(--amber); }

  .stat-num {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-card.solved .stat-num { color: var(--accent); }
  .stat-card.remaining .stat-num { color: var(--blue); }
  .stat-card.revision .stat-num { color: var(--amber); }

  .stat-label {
    font-size: 11px;
    color: var(--text2);
    font-family: var(--mono);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── CONTROLS ── */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 13px;
    pointer-events: none;
    font-family: var(--mono);
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 12px 8px 30px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }

  .topic-select {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
  }

  .filter-pills {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px;
  }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .pill:hover { color: var(--text); }
  .pill.active { background: var(--accent); color: #000; font-weight: 700; }
  .pill.active-rev { background: var(--amber); color: #000; font-weight: 700; }
  .pill.active-solved { background: var(--accent); color: #000; font-weight: 700; }
  .pill.active-todo { background: var(--blue); color: #000; font-weight: 700; }

  /* ── TOPIC SECTIONS ── */
  .topics { display: flex; flex-direction: column; gap: 10px; }

  .topic-section {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .topic-section:hover { border-color: var(--border2); }

  .topic-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0.875rem 1.125rem;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .topic-header:hover { background: var(--surface2); }

  .topic-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--border2);
    transition: background 0.3s;
  }

  .topic-dot.partial { background: var(--amber); }
  .topic-dot.complete { background: var(--accent); }

  .topic-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    letter-spacing: -0.01em;
  }

  .topic-bar-wrap {
    flex: 0 0 120px;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .topic-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.5s;
  }

  .topic-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    min-width: 44px;
    text-align: right;
  }

  .topic-chevron {
    width: 16px;
    height: 16px;
    color: var(--text3);
    transition: transform 0.2s;
    flex-shrink: 0;
  }

  .topic-chevron.open { transform: rotate(90deg); }

  .topic-body { display: none; }
  .topic-body.open { display: block; }

  /* ── PROBLEM ROWS ── */
  .problem-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 1.125rem;
    border-top: 1px solid var(--border);
    transition: background 0.1s;
  }

  .problem-row:hover { background: var(--surface2); }

  .cb-wrap {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    background: transparent;
  }

  .cb-wrap:hover { border-color: var(--accent); }
  .cb-wrap.checked { background: var(--accent); border-color: var(--accent); }

  .cb-check {
    display: none;
    color: #000;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    font-family: var(--mono);
  }

  .cb-wrap.checked .cb-check { display: block; }

  .problem-name {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
    transition: color 0.2s;
  }

  .problem-name.done {
    color: var(--text3);
    text-decoration: line-through;
    text-decoration-color: var(--text3);
  }

  .lc-link {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--blue-dim);
    color: var(--blue);
    white-space: nowrap;
    transition: background 0.15s;
  }

  .lc-link:hover { background: rgba(68,136,255,0.25); }

  .rev-btn {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .rev-btn:hover { border-color: var(--amber); color: var(--amber); }
  .rev-btn.flagged { background: var(--amber-dim); color: var(--amber); border-color: transparent; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 13px;
  }

  /* ── FOOTER ── */
  .footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
  }

  .reset-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
    background: transparent;
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: var(--radius);
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.6;
  }

  .reset-btn:hover { opacity: 1; background: rgba(255,68,68,0.08); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .h-progress { display: none; }
    .h-stat.hide-mob { display: none; }
    .topic-bar-wrap { display: none; }
    .hero-title { font-size: 28px; }
  }

  @media (max-width: 400px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .controls { flex-direction: column; }
    .search-wrap { width: 100%; }
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .topic-section {
    animation: fadeIn 0.3s ease both;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">DSA/450</div>
  <div class="header-stats">
    <div class="h-stat hide-mob">solved <span id="h-done">0</span></div>
    <div class="h-progress"><div class="h-progress-fill" id="h-bar" style="width:0%"></div></div>
    <div class="h-pct" id="h-pct">0%</div>
    <div class="h-stat hide-mob">remaining <span id="h-left">450</span></div>
  </div>
</header>

<main class="main">
  <div class="hero">
    <div class="hero-tag">Love Babbar's curated sheet</div>
    <h1 class="hero-title">Final 450 <span class="dim">DSA Tracker</span></h1>
    <div class="hero-sub">Track your progress · Mark for revision · Filter by topic</div>
  </div>

  <div class="stats-row">
    <div class="stat-card total">
      <div class="stat-num" id="s-total">450</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card solved">
      <div class="stat-num" id="s-done">0</div>
      <div class="stat-label">Solved</div>
    </div>
    <div class="stat-card remaining">
      <div class="stat-num" id="s-left">450</div>
      <div class="stat-label">Remaining</div>
    </div>
    <div class="stat-card revision">
      <div class="stat-num" id="s-rev">0</div>
      <div class="stat-label">Revision</div>
    </div>
  </div>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">/</span>
      <input class="search-input" id="search" type="text" placeholder="search problems..." oninput="renderAll()">
    </div>
    <select class="topic-select" id="topic-filter" onchange="renderAll()">
      <option value="">All topics</option>
    </select>
    <div class="filter-pills">
      <button class="pill active" id="pill-all" onclick="setFilter('all',this)">All</button>
      <button class="pill" id="pill-todo" onclick="setFilter('todo',this)">Unsolved</button>
      <button class="pill" id="pill-done" onclick="setFilter('done',this)">Solved</button>
      <button class="pill" id="pill-rev" onclick="setFilter('rev',this)">Revision</button>
    </div>
  </div>

  <div class="topics" id="topics"></div>

  <div class="footer">
    <span>Progress saved in your browser · <span id="f-pct">0%</span> complete</span>
    <button class="reset-btn" onclick="resetAll()">Reset all progress</button>
  </div>
</main>

const SK = 'f450_v2';
let state = {};
let activeFilter = 'all';

function load() {
  try { state = JSON.parse(localStorage.getItem(SK) || '{}'); } catch(e) { state = {}; }
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(state)); } catch(e) {}
}

function key(topic, idx) { return topic + '::' + idx; }
function isDone(k) { return !!(state[k] && state[k].d); }
function isRev(k) { return !!(state[k] && state[k].r); }

function toggleDone(topic, idx) {
  const k = key(topic, idx);
  if (!state[k]) state[k] = {};
  state[k].d = !state[k].d;
  save(); renderAll();
}

function toggleRev(topic, idx) {
  const k = key(topic, idx);
  if (!state[k]) state[k] = {};
  state[k].r = !state[k].r;
  save(); renderAll();
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.pill').forEach(p => p.className = 'pill');
  btn.className = 'pill active';
  renderAll();
}

function getStats() {
  let total = 0, done = 0, rev = 0;
  DATA.forEach(t => t.problems.forEach((p, i) => {
    total++;
    const k = key(t.topic, i);
    if (isDone(k)) done++;
    if (isRev(k)) rev++;
  }));
  return { total, done, rev };
}

function updateHeader(stats) {
  const pct = Math.round(stats.done / stats.total * 100);
  document.getElementById('h-done').textContent = stats.done;
  document.getElementById('h-left').textContent = stats.total - stats.done;
  document.getElementById('h-bar').style.width = pct + '%';
  document.getElementById('h-pct').textContent = pct + '%';
  document.getElementById('s-total').textContent = stats.total;
  document.getElementById('s-done').textContent = stats.done;
  document.getElementById('s-left').textContent = stats.total - stats.done;
  document.getElementById('s-rev').textContent = stats.rev;
  document.getElementById('f-pct').textContent = pct + '%';
}

function renderAll() {
  const stats = getStats();
  updateHeader(stats);

  const search = document.getElementById('search').value.toLowerCase().trim();
  const topicF = document.getElementById('topic-filter').value;
  const container = document.getElementById('topics');
  container.innerHTML = '';

  let anyVisible = false;

  DATA.forEach((t, ti) => {
    if (topicF && t.topic !== topicF) return;

    const filtered = t.problems.map((p, i) => ({ p, i })).filter(({ p, i }) => {
      const k = key(t.topic, i);
      if (search && !p.toLowerCase().includes(search)) return false;
      if (activeFilter === 'done' && !isDone(k)) return false;
      if (activeFilter === 'todo' && isDone(k)) return false;
      if (activeFilter === 'rev' && !isRev(k)) return false;
      return true;
    });

    if (filtered.length === 0) return;
    anyVisible = true;

    const total = t.problems.length;
    const done = t.problems.filter((p, i) => isDone(key(t.topic, i))).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const dotClass = done === 0 ? '' : done === total ? 'complete' : 'partial';

    const sec = document.createElement('div');
    sec.className = 'topic-section';
    sec.style.animationDelay = (ti * 0.03) + 's';

    const rows = filtered.map(({ p, i }) => {
      const k = key(t.topic, i);
      const done = isDone(k);
      const rev = isRev(k);
      return `
        <div class="problem-row">
          <div class="cb-wrap ${done ? 'checked' : ''}" onclick="toggleDone('${t.topic}',${i})">
            <span class="cb-check">✓</span>
          </div>
          <span class="problem-name ${done ? 'done' : ''}">${p}</span>
          <button class="rev-btn ${rev ? 'flagged' : ''}" onclick="toggleRev('${t.topic}',${i})">${rev ? '★ rev' : '☆ rev'}</button>
        </div>`;
    }).join('');

    sec.innerHTML = `
      <div class="topic-header" onclick="toggleSec(this)">
        <div class="topic-dot ${dotClass}"></div>
        <div class="topic-name">${t.topic}</div>
        <div class="topic-bar-wrap"><div class="topic-bar-fill" style="width:${pct}%"></div></div>
        <div class="topic-count">${done}/${total}</div>
        <svg class="topic-chevron" viewBox="0 0 16 16" fill="none">
          <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="topic-body">${rows}</div>`;

    container.appendChild(sec);
  });

  if (!anyVisible) {
    container.innerHTML = '<div class="empty">No problems match your filters.</div>';
  }
}

function toggleSec(header) {
  const body = header.nextElementSibling;
  const chev = header.querySelector('.topic-chevron');
  const open = body.classList.toggle('open');
  chev.classList.toggle('open', open);
}

function resetAll() {
  if (confirm('Reset ALL progress? This cannot be undone.')) {
    state = {};
    save();
    renderAll();
  }
}

function init() {
  load();
  const sel = document.getElementById('topic-filter');
  DATA.forEach(t => {
    const o = document.createElement('option');
    o.value = t.topic;
    o.textContent = t.topic;
    sel.appendChild(o);
  });
  renderAll();
}

init();
</script>
